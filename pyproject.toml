[project]
name = "project-12-multimodal-rag"
version = "0.1.0"
description = "Advanced Multi-Modal RAG with Document Intelligence, Hybrid Search, Reranker and Azure AI Evaluation"
requires-python = ">=3.11"

dependencies = [
    # Azure AI
    "azure-ai-formrecognizer==3.3.3",
    "azure-search-documents==11.4.0",
    "azure-cosmos==4.7.0",
    "azure-identity==1.19.0",
    "openai==1.55.0",

    # RAG / ML
    "sentence-transformers==3.3.1",
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "tiktoken==0.8.0",

    # API
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",

    # Evaluation
    "mlflow==2.16.0",
    "azure-ai-evaluation==1.3.0",

    # Utils
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "loguru==0.7.2",
    "httpx==0.27.0",
    "tenacity==9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
select = ["E", "F", "W"]
ignore = ["E501"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"